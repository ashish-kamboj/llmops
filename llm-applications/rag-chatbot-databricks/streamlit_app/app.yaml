# =============================================================================
# RAG Chatbot - Databricks App Configuration
# =============================================================================
# This file configures the Streamlit app for deployment on Databricks Apps.
#
# Key settings:
# - command: Streamlit run command (uses DATABRICKS_APP_PORT automatically)
# - env: Environment variables for the app
# - resources: Databricks resources the app needs access to
# =============================================================================

command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "$DATABRICKS_APP_PORT"
  - --server.headless
  - "true"

env:
  - name: SERVING_ENDPOINT
    value: rag_project_docs_endpoint

resources:
  - name: rag-serving-endpoint
    serving_endpoint:
      name: rag_project_docs_endpoint
      permission: CAN_QUERY
